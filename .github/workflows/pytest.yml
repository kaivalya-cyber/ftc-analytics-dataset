name: Pytest Suite

on:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "pages/*.py"
      - "shared.py"
      - "dashboard.py"
      - "requirements.txt"
      - "data/processed/*.csv"
      - "data/processed/*.json"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest scripts/test_data_validation.py -v --tb=short
